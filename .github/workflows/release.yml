name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: idea-plugin
        run: ./gradlew test

  cli:
    name: CLI ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package CLI with bundled JRE
        shell: bash
        run: ./scripts/package-cli-release.sh "${GITHUB_REF_NAME#v}"

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: idea-plugin/build/release/cli/*.zip

  plugin:
    name: IDEA plugin
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin zip
        working-directory: idea-plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: idea-plugin
          path: idea-plugin/build/distributions/git-ai-commit-plugin-*.zip

  github-release:
    name: GitHub Release
    needs:
      - cli
      - plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          assets=(dist/**/*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were produced." >&2
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
